name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra docs
      - run: uv run mkdocs gh-deploy --force
