[project]
name = "roofsight"
version = "0.1.0"
description = "Ground-view roof and rooftop-obstacle segmentation for on-site PV planning: dataset, benchmark, models, Core ML export."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Bünyamin Ulupinar" }]
keywords = ["photovoltaics", "roof", "segmentation", "dataset", "benchmark", "coreml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "pycocotools>=2.0.7",
  "imagehash>=4.3",
  "scipy>=1.12",
]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "rfdetr>=1.0", "supervision>=0.20"]
label = ["fiftyone>=0.24", "supervision>=0.20"]
export = ["onnx>=1.15", "onnxruntime>=1.17", "coremltools>=8.0"]
docs = ["mkdocs-material>=9.5"]
all = ["roofsight[train,label,export,docs]"]

[project.scripts]
roofsight = "roofsight.cli:app"

[project.urls]
Homepage = "https://github.com/bnymnDev/roofsight"
Documentation = "https://github.com/bnymnDev/roofsight/tree/main/docs"
Issues = "https://github.com/bnymnDev/roofsight/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-Pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roofsight"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["roofsight"]

[[tool.mypy.overrides]]
module = [
  "pycocotools.*", "imagehash.*", "scipy.*", "fiftyone.*", "rfdetr.*",
  "supervision.*", "onnxruntime.*", "coremltools.*", "onnx.*", "torch.*",
  "torchvision.*", "sam3.*", "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
